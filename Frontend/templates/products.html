{% extends 'base.html' %}
{% block content %}
    <h1>All Products</h1> 
<table>
    <thead>
        <tr>
            <th>Product name</th>
            <th>Product code</th>
            <th>Price</th>
            <th>gst</th>
            <th>Food product</th>
            <th>Update</th>
            <th>Delete</th>

        </tr>
    </thead>
    <tbody>
        {%  for product in all_products %}
        <tr>
            <td>{{product.Product_name}}</td>
            <td>{{product.Product_code}}</td>
            <td>{{product.Price}}</td>
            <td>{{product.gst}}</td>
            <td>{{product.Food_Product}}</td>
            <td>
                <button>Update</button>
            </td>
            <td>
                <a href="{% url 'product_delete' product.id %}">
                <button>Delete</button>
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
       

{% endblock %}
